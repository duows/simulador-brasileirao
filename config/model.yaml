# Configuração do modelo futdados.
# Todo número aqui é explícito e editável. Mudanças relevantes devem ser
# registradas em docs/DECISIONS.md.

paths:
  db: data/futdados.sqlite
  raw: data/raw
  historical_repo: data/external/footballcsv-cache.wfb
  weights: data/model/weights.json
  videos: out/videos
  reports: reports
  teams: config/teams.csv
  coach_changes: config/coach_changes.csv
  site_data: site/public/data   # JSONs lidos pelo site estático (futdados export-site)
  finance: data/finance

api:
  base_url: https://api.football-data.org/v4
  competition: BSA
  requests_per_minute: 10   # limite do plano grátis

historical:
  # footballcsv (CC0). O repo "world" só tem 2019-2020; cache.wfb tem 2003-2024 (ver DECISIONS D14).
  repo_url: https://github.com/footballcsv/cache.wfb
  first_season: 2006       # pontos corridos com 20 clubes desde 2006 (cache.wfb tem 2006-2009 completos)
  last_season: 2024        # 2024 incompleta no cache (até set/2024); a API cobre 2024-2026

model:
  # a. Força de longo prazo (ataque e defesa) com decaimento temporal.
  half_life_days: 365          # escolhida no walk-forward 2010-2014 (ver reports/pesos.md)
  half_life_grid: [60, 90, 180, 365, 730, 1460]
  prior_matches: 5             # jogos "fictícios" que puxam a força para o valor a priori
  # "auto": promovidos partem do desempenho médio histórico de promovidos no 1º ano, estimado
  # só com temporadas anteriores. Times que estavam na temporada anterior partem da média (1,0).
  prior_attack_ratio: auto
  prior_defense_ratio: auto
  prior_fallback: [0.85, 1.15] # usado só enquanto não há temporada anterior nos dados
  # b. Forma recente
  form_matches: 5
  # d. Descanso e calendário
  rest_clip_days: [2, 10]      # dias de descanso são limitados a este intervalo
  midweek_days: [1, 2, 3]      # terça, quarta, quinta (0 = segunda)
  # e. Troca de técnico
  new_coach_matches: 5         # técnico é "novo" nos primeiros N jogos dele no clube
  # Estimação
  opponent_adjust: true        # gols ajustados pela força do adversário
  ridge_alpha: 1.0             # força da regularização (escala padronizada)
  train_first_season: 2007     # 2006 serve só de aquecimento das forças
  bootstrap: 200               # reamostragens para o intervalo de incerteza
  max_goals: 10                # tamanho da matriz de placares
  dixon_coles: false           # ajuste de placares baixos; rho estimado ~ -0,01 (ver DECISIONS.md D09)

elo:
  tune_seasons: [2008, 2009, 2010, 2011, 2012, 2013, 2014]   # 2006-2007 aquecem os ratings

backtest:
  tune_seasons: [2012, 2013, 2014]   # escolha da meia-vida
  test_seasons: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]  # 2026: só jogos já disputados
  calibration_bins: 10

simulation:
  n_sims: 20000
  parameter_uncertainty: true   # sorteia ataque/defesa de cada time em cada simulação (erro de Laplace)
  seed: 20260101
  # Critérios de desempate, em ordem. Fonte: imprensa sobre o Regulamento
  # Específico da Série A 2026 (Art. 15). TODO: confirmar no PDF oficial da CBF.
  # red_cards e yellow_cards não estão disponíveis no plano grátis da API e são
  # ignorados (cai no sorteio).
  tiebreakers: [points, wins, goal_difference, goals_for, head_to_head, red_cards, yellow_cards, draw_lots]
  zones:
    titulo: [1, 1]
    g4: [1, 4]
    g6: [1, 6]
    rebaixamento: [17, 20]

preseason:
  # Calendário gerado (só quando a API ainda não publicou a tabela da temporada)
  start_date: "04-11"          # mês-dia da 1ª rodada; uma rodada por semana, aos sábados
  kickoff_hour_utc: 22

production:
  # Motor de produção dos jogos: gols esperados pelas forças por time, probabilidade pelo conjunto
  # forças + Elo (pesos do backtest). false = volta ao Poisson de 7 fatores.
  enabled: true
  half_life_days: 365

cartola:
  # Estudo de caso pessoal (só local): pontuação esperada no Cartola FC e time por orçamento.
  season: 2026
  shrink: 5                 # jogos fictícios na média da posição (pouca amostra puxa para a média)
  alpha: 10                 # ridge leve dos coeficientes por posição
  first_backtest_round: 6
  captain_multiplier: 1.5   # TODO: confirmar a regra vigente do capitão no Cartola
  registro_orcamentos: [100, 120, 140, 160]   # times sugeridos gravados a cada rodada
  reservas:                 # banco: 1 por posição (sem técnico); entra se um titular da posição não jogar
    ativo: true
    preco_maximo: titular_mais_barato   # TODO confirmar a regra vigente; "livre" = sem limite de preço
    # reserva de luxo (substitui mesmo quem jogou) ainda não implementada
  p_jogar:                  # chance de jogar pelo status do mercado (não estimada: sem histórico de status)
    provavel: 0.95
    duvida: 0.5

output:
  focus_team: sao-paulo
  atribuicao: "Football data provided by the Football-Data.org API"
  aviso: "Projeção estatística baseada em dados históricos. Não é recomendação de aposta."
