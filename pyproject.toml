[project]
name = "futdados"
version = "0.1.0"
description = "Probabilidades estimadas e projeções do Brasileirão Série A com modelo transparente"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
futdados = "futdados.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["site", "data", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702", "E731", "B905"]

[tool.ruff.lint.per-file-ignores]
# relatórios montam linhas de tabela Markdown, que ficam mais legíveis numa linha só
"src/futdados/reports.py" = ["E501"]
